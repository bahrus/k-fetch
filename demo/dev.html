<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Onion</title>
</head>
<body>
    You need to open cors-anywhere first: <a href=https://cors-anywhere.herokuapp.com/corsdemo target=_blank>https://cors-anywhere.herokuapp.com/corsdemo</a>
    <k-fetch 
    href=https://cors-anywhere.herokuapp.com/https://www.theonion.com/ 
    as=html shadow=open credentials=omit onerror="console.error(href)"></k-fetch>
    <script type=module src=../k-fetch.js></script>
</body>
</html>
